name: Keep-alive

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping backend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        env:
          BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
        run: |
          url="${BACKEND_HEALTH_URL:-https://cartify-api-g3hs.onrender.com/health}"
          echo "Pinging $url"
          curl -fsS --retry 5 --retry-all-errors --max-time 90 "$url"
